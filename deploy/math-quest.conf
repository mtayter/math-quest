# Math Quest: https://<your-hostname>/math/ -> local backend
# Install: copy to /etc/apache2/conf-available/math-quest.conf,
#          a2enconf math-quest, then reload apache.
# Port 18791 must match "port" in config.json — install.sh prints the
# matching block if you chose a different port.
<Location /math/>
    ProxyPass http://127.0.0.1:18791/
    ProxyPassReverse http://127.0.0.1:18791/
</Location>
